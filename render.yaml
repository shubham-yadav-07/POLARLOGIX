# Render.com blueprint. In the Render dashboard: New -> Blueprint -> point at this repo.
# Creates a web service (the API + static frontend) and a managed PostgreSQL database.
databases:
  - name: polarlogix-db
    plan: free
    databaseName: polarlogix
    user: polarlogix

services:
  - type: web
    name: polarlogix
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: polarlogix-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_DEMO_DATA
        value: "true"
      - key: DEMO_PASSWORD
        value: polar2026
      - key: DEMO_MODE
        value: "false"
      - key: ALLOW_LINK_SIM
        value: "true"
