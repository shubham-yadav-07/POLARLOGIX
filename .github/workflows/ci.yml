name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: polarlogix
          POSTGRES_PASSWORD: polarlogix_test
          POSTGRES_DB: polarlogix_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U polarlogix"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests against SQLite (fast path)
        run: pytest tests/ -q

      - name: Run tests against PostgreSQL (matches production)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://polarlogix:polarlogix_test@localhost:5432/polarlogix_test
        run: pytest tests/ -q

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t polarlogix:ci .
      - name: Smoke-test the image
        run: |
          docker run -d --name pl -p 8000:8000 \
            -e SECRET_KEY=ci-test-secret-key-with-32-plus-chars \
            -e DATABASE_URL=sqlite:////tmp/ci.db \
            polarlogix:ci
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/api/health && break
            sleep 1
          done
          curl -sf http://localhost:8000/api/health
          docker logs pl
          docker stop pl
